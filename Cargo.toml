[package]
name = "diplomovka_root"
version = "0.1.0"
publish = false
authors = ["Oskar Mihalik"]
edition = "2021"

[workspace]
members = [
    "backend",
    "bevy_diplomovka",
    "dto",
    "loadtest",
    "model",
    "run-wasm",
    "backend-wake-up", "bevy_rendering_benchmark", "bencmark_results",
    "framework_bench/axum", "framework_bench/runner",
]

# Profiles only take effect in the workspace root; they apply to every member
# Optimize dependencies in dev builds, bevy is unusably slow otherwise
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# Size-optimized profile for the web build, used by trunk (see bevy_diplomovka/Trunk.toml).
# Kept separate from `release` so other workspace members (backend, ...) build with defaults.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
# fat LTO peaks at ~8.4 GB and runs out of memory on render.com (8 GB), thin peaks at ~5.3 GB
lto = "thin"
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true
