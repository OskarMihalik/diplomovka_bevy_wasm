[package]
name = "model"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
postgres-types = "0.2.4"
cornucopia_async = "0.6.0"
tokio-postgres = { version = "0.7.7", features = [
    "with-serde_json-1",
    "with-time-0_3",
    "with-uuid-1",
    "with-eui48-1",
] }
futures = "0.3.25"
time = "0.3.18"

[build-dependencies]
dotenv = "0.15.0"
cornucopia = "0.9.0"
postgres = "0.19.9"
