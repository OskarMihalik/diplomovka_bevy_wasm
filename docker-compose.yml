version: '3.9'

services:
  postgres:
    image: postgres:14-alpine
    ports:
      - 5438:5432
    volumes:
      - ./db/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=bevy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bevy"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Comparison backend for the load test. It is started only when it is named explicitly
  # (`docker compose up backend-express`, as loadtest does) or with `--profile loadtest`.
  backend-express:
    profiles: ["loadtest"]
    build:
      context: .
      dockerfile: Dockerfile.backend-express
      args:
        - DB_POSTGRES_PORT=5432
        - DB_POSTGRES_USER=postgres
        - DB_POSTGRES_PASSWORD=postgres
        - DB_POSTGRES_DB=bevy
        - DB_POSTGRES_HOST=postgres
        - PORT=4001
    ports:
      - "4001:4001"
    # Symmetric with backend: BACKEND_THREADS (default 28, the logical CPUs of the test machine)
    # cluster workers, each with one libuv thread for argon2 and file writes and one database
    # connection, so both backends run BACKEND_THREADS JS workers / Tokio workers, at most
    # BACKEND_THREADS concurrent hashes and hold BACKEND_THREADS database connections.
    environment:
      - WORKERS=${BACKEND_THREADS:-28}
      - UV_THREADPOOL_SIZE=1
      - DB_POOL_SIZE=1
    # same limit as backend
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - postgres
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - SKIP_DB_BUILD=1
        - DB_POSTGRES_PORT=5432
        - DB_POSTGRES_PASSWORD=postgres
        - DB_POSTGRES_USER=postgres
        - DB_POSTGRES_DB=bevy
        - DB_HOST=postgres
        - PORT=4000
    ports:
      - "4000:4000"
    # Symmetric with backend-express: BACKEND_THREADS Tokio workers, blocking threads (argon2,
    # file writes) and database connections.
    environment:
      - TOKIO_WORKER_THREADS=${BACKEND_THREADS:-28}
      - BLOCKING_THREADS=${BACKEND_THREADS:-28}
      - DB_POOL_SIZE=${BACKEND_THREADS:-28}
    # the default soft limit of 1024 open files is too low for 1000 concurrent connections
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - postgres

