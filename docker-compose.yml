version: '3.9'

services:
  postgres:
    image: postgres:14-alpine
    ports:
      - 5438:5432
    volumes:
      - ./db/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=bevy

  backend-express:
    build:
      context: .
      dockerfile: Dockerfile.backend-express
    ports:
      - "4001:4001"
    depends_on:
      - postgres
    environment:
      - DB_POSTGRES_PORT=5432
      - DB_POSTGRES_USER=postgres
      - DB_POSTGRES_PASSWORD=postgres
      - DB_POSTGRES_DB=bevy
      - DB_POSTGRES_HOST=postgres
      - BACKEND_PORT=4001
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    environment:
      - DB_POSTGRES_PORT=5432
      - DB_POSTGRES_USER=postgres
      - DB_POSTGRES_PASSWORD=postgres
      - DB_POSTGRES_DB=bevy
      - DB_POSTGRES_HOST=postgres
      - BACKEND_PORT=4000
      - SKIP_DB_BUILD
