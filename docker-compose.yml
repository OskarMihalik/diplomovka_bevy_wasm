version: '3.9'

services:
  postgres:
    image: postgres:14-alpine
    ports:
      - 5438:5432
    volumes:
      - ./db/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=bevy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    environment:
      - DB_PORT=5438
      - BACKEND_PORT=4000
      - SKIP_DB_BUILD
      # Additional backend env variables

  bevy_diplomovka:
    build:
      context: .
      dockerfile: Dockerfile.bevy
    ports:
      - "8081:80"
    depends_on:
      - backend

