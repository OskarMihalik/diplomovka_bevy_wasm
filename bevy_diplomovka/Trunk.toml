[build]
public_url = "./"
# `trunk serve` / `trunk build` use the fast dev profile.
# Smallest release bundle (wasm-release profile + wasm-opt, see index.html):
#   trunk build --release --cargo-profile wasm-release

[serve]
port = 8081
# addresses = ["0.0.0.0"]

[watch]
watch = [
    "./src",
    "./assets",
    "build",
] # Paths to watch. The `build.target`'s parent folder is watched by default.
