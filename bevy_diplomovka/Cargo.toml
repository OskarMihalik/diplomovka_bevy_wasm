[package]
name = "bevy_diplomovka"                         # ToDo
version = "0.1.0"
publish = false
authors = ["Oskar Mihalik"]                      # ToDo: you are the author ;)
edition = "2021"
exclude = ["dist", "build", "assets", "credits"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
# xbuild also uses this profile for building android AABs because I couldn't find a configuration for it
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = ["bevy/dynamic_linking"]

# All of Bevy's default features exept for the audio related ones (bevy_audio, vorbis), since they clash with bevy_kira_audio
#   and android_shared_stdcxx/android-game-activity, since those are covered in `mobile`
[dependencies]
ureq = { version = "*", features = ["tls"] }
base64 = "0.22.0"
time = { version = "0.3.18", features = ["serde"] }
egui-toast = "0.15.0"
serde_json = "1.0"
iyes_perf_ui = { git = "https://github.com/IyesGames/iyes_perf_ui.git" }
bevy_file_dialog = { git = "https://github.com/richardhozak/bevy_file_dialog.git" }
bevy_panorbit_camera = "0.21"
wasm-bindgen = "=0.2.97"
dto = { path = "../dto" }
bevy_egui = { version = "0.31", default-features = false, features = [
    "open_url",
    "default_fonts",
    "render",
] }
bevy = { version = "0.15", default-features = false, features = [
    "animation",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gizmos",
    "bevy_gltf",
    "bevy_mesh_picking_backend",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_sprite_picking_backend",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_picking_backend",
    "bevy_window",
    "bevy_winit",
    "custom_cursor",
    "default_font",
    "hdr",
    "multi_threaded",
    "jpeg",
    "png",
    "smaa_luts",
    "sysinfo_plugin",
    "tonemapping_luts",
    "webgl2",
    "x11",
    # "dynamic_linking",
] }
bevy_kira_audio = { version = "0.21" }
bevy_asset_loader = { version = "0.22" }
rand = { version = "0.8.3" }
webbrowser = { version = "1", features = ["hardened"] }
bevy_flycam = "0.15.0"
bevy_mod_reqwest = "0.18"

# keep the following in sync with Bevy's dependencies
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
## This greatly improves WGPU's performance due to its heavy use of trace! calls
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

[build-dependencies]
embed-resource = "1"
