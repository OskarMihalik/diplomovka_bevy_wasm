[package]
name = "bevy_diplomovka"                         # ToDo
version = "0.1.0"
publish = false
authors = ["Oskar Mihalik"]                      # ToDo: you are the author ;)
edition = "2021"
exclude = ["dist", "build", "assets", "credits"]

[features]
dev = ["bevy/dynamic_linking"]
# bevy_dev_tools overlays for inspecting loaded glb models (see src/debug_tools.rs)
debug_tools = [
    "bevy/bevy_dev_tools",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_text",
]

[dependencies]
js-sys = "0.3.66"
wasm-bindgen-futures = "0.4.39"
web-sys = { version = "0.3.98", features = [
    "Request",
    "Window",
    "Response",
    "Document",
    "Element",
    "HtmlInputElement",
    "FileList",
    "File",
    "Blob",
    "Navigator",
] }
serde = "1.0.217"
time = { version = "0.3.18", features = ["serde"] }
egui-toast = "0.20"
serde_json = "1.0"
bevy_file_dialog = { git = "https://github.com/superjesse07/bevy_file_dialog.git" }
bevy_panorbit_camera = { version = "0.35", features = ["bevy_egui"] }
wasm-bindgen = "=0.2.121"
dto = { path = "../dto" }
bevy_egui = { version = "0.40", default-features = false, features = [
    "open_url",
    "default_fonts",
    "render",
    "picking",
] }
# The `3d` collection minus gamepad support and native-only platform features
bevy = { version = "0.19", default-features = false, features = [
    # default_app
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    # glTF scenes are spawned through reflection, every component in them (Transform, Mesh3d, ...)
    # has to be in the type registry or opening a model panics
    "reflect_auto_register",
    # default_platform
    "std",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "custom_cursor",
    # rendering
    "3d_bevy_render",
    "scene",
    "picking",
    "jpeg",
    "web",
    # models are loaded from the backend over http(s)
    "http",
    "https",
    # "dynamic_linking",
] }
bevy_asset_loader = { version = "0.27" }
bevy_mod_reqwest = "0.22.1"
# only needed to enable the `multipart` feature used in api.rs
reqwest = { version = "0.12", default-features = false, features = ["multipart"] }
# glam pulls in getrandom 0.3, which needs the `wasm_js` backend on the web (see .cargo/config.toml)
getrandom = { version = "0.3", features = ["wasm_js"] }

# keep the following in sync with Bevy's dependencies
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
## This greatly improves WGPU's performance due to its heavy use of trace! calls
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
egui_extras = { version = "0.34", default-features = false }
egui_commonmark = "0.23"
bevy_mod_outline = "0.13"
dotenv = "0.15.0"
dotenv_codegen = "0.15.0"
egui_form = { version = "0.8", features = ["validator_garde"] }
garde = { version = "0.22", features = ["derive", "email"] }

[build-dependencies]
wasm-bindgen-cli = "0.2.121"
embed-resource = "1"
