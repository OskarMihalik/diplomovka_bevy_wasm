[package]
name = "bevy_diplomovka"                         # ToDo
version = "0.1.0"
publish = false
authors = ["Oskar Mihalik"]                      # ToDo: you are the author ;)
edition = "2021"
exclude = ["dist", "build", "assets", "credits"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
# xbuild also uses this profile for building android AABs because I couldn't find a configuration for it
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy-inspector-egui = "0.37"
js-sys = "0.3.66"
wasm-bindgen-futures = "0.4.39"
web-sys = { version = "0.3.98", features = [
    "Request",
    "Window",
    "Response",
    "Document",
    "Element",
    "HtmlInputElement",
    "FileList",
    "File",
    "Blob",
] }
serde = "1.0.217"
time = { version = "0.3.18", features = ["serde"] }
egui-toast = "0.20"
serde_json = "1.0"
bevy_perf_ui = "0.7"
bevy_file_dialog = { git = "https://github.com/superjesse07/bevy_file_dialog.git" }
bevy_panorbit_camera = { version = "0.35", features = ["bevy_egui"] }
wasm-bindgen = "=0.2.121"
dto = { path = "../dto" }
bevy_egui = { version = "0.40", default-features = false, features = [
    "open_url",
    "default_fonts",
    "render",
    "picking",
] }
bevy = { version = "0.19", default-features = false, features = [
    "3d",
    "jpeg",
    "web",
    "http",
    "https",
    # "dynamic_linking",
] }
bevy_asset_loader = { version = "0.27" }
bevy_mod_reqwest = "0.22.1"
# only needed to enable the `multipart` feature used in api.rs
reqwest = { version = "0.12", default-features = false, features = ["multipart"] }
# glam pulls in getrandom 0.3, which needs the `wasm_js` backend on the web (see .cargo/config.toml)
getrandom = { version = "0.3", features = ["wasm_js"] }

# keep the following in sync with Bevy's dependencies
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
## This greatly improves WGPU's performance due to its heavy use of trace! calls
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
egui_extras = { version = "0.34", default-features = false }
egui_commonmark = "0.23"
bevy_mod_outline = "0.13"
dotenv = "0.15.0"
dotenv_codegen = "0.15.0"
egui_form = { version = "0.8", features = ["validator_garde"] }
garde = { version = "0.22", features = ["derive", "email"] }

[build-dependencies]
wasm-bindgen-cli = "0.2.121"
embed-resource = "1"
