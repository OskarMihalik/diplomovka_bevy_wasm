server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the `.gz` files created at build time (see Dockerfile.bevy),
    # fall back to compressing on the fly for anything that wasn't precompressed.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
