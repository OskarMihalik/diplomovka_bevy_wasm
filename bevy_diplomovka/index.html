<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>DP</title>
    <!-- ToDo -->
    <!-- wasm-opt only runs for `trunk build --release`; the flags match the features rustc emits -->
    <link
      data-trunk
      rel="rust"
      data-bin="bevy_diplomovka"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="copy-dir" href="credits" />
    <link data-trunk rel="copy-file" href="build/windows/icon.ico" />
    <link rel="icon" href="icon.ico" />
    <link data-trunk rel="inline" href="build/web/styles.css" />
  </head>
  <body>
    <link data-trunk rel="inline" href="build/web/sound.js" />
    <div class="game-container">
      <div class="lds-dual-ring"></div>
      <canvas id="bevy"> Javascript and support for canvas is required </canvas>
    </div>
    <script>
      // Bench mode (src/bench_mode.rs): posts results to rendering_runner when the url has
      // `?report=<url>`, one message after another so `done` arrives after the last row.
      // src/report.rs calls it for every CSV row, at the end and on errors.
      (() => {
        const url = new URLSearchParams(location.search).get("report");
        if (!url) return;
        let queue = Promise.resolve();
        window.benchReport = (message) => {
          const body = JSON.stringify(message);
          queue = queue
            .then(() => fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body }))
            .catch((error) => console.error("report failed:", error));
        };
        // a wasm trap (e.g. out of memory) isn't a Rust panic
        addEventListener("error", (event) => window.benchReport({ error: String(event.error ?? event.message) }));
        addEventListener("unhandledrejection", (event) => window.benchReport({ error: String(event.reason) }));
      })();
    </script>
    <script>
      // Keep Tab inside the canvas so egui can move focus between inputs
      // (default event handling is otherwise left to the browser, see main.rs)
      document.getElementById("bevy").addEventListener("keydown", (e) => {
        if (e.key === "Tab") e.preventDefault();
      });
    </script>
  </body>
</html>
