<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>DP</title>
    <!-- ToDo -->
    <!-- wasm-opt only runs for `trunk build --release`; the flags match the features rustc emits -->
    <link
      data-trunk
      rel="rust"
      data-bin="bevy_diplomovka"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="copy-dir" href="credits" />
    <link data-trunk rel="copy-file" href="build/windows/icon.ico" />
    <link rel="icon" href="icon.ico" />
    <link data-trunk rel="inline" href="build/web/styles.css" />
  </head>
  <body>
    <link data-trunk rel="inline" href="build/web/sound.js" />
    <div class="game-container">
      <div class="lds-dual-ring"></div>
      <canvas id="bevy"> Javascript and support for canvas is required </canvas>
    </div>
    <script>
      // Keep Tab inside the canvas so egui can move focus between inputs
      // (default event handling is otherwise left to the browser, see main.rs)
      document.getElementById("bevy").addEventListener("keydown", (e) => {
        if (e.key === "Tab") e.preventDefault();
      });
    </script>
  </body>
</html>
